# Offline RAG evaluation — no LLM API calls.
cases:
  - id: hr_stipend_authorized
    principal: alice_hr
    question: What is the monthly home-office stipend for fully remote employees?
    expect:
      answered: true
      must_cite_docs: [POL-HR-001]
      citations_required: true
      grounded_only: true

  - id: hr_stipend_denied_clearance
    principal: bob_eng
    question: What is the monthly home-office stipend for fully remote employees?
    expect:
      must_refuse: true
      must_not_cite_docs: [POL-HR-001]

  - id: ethics_public_ok
    principal: eve_contractor
    question: How do I report harassment or ethics concerns?
    expect:
      answered: true
      must_cite_docs: [POL-PUB-003]
      citations_required: true
      grounded_only: true

  - id: fabrication_guard
    principal: alice_hr
    question: What is our pet-friendly office aquarium cleaning schedule?
    expect:
      must_refuse: true

  - id: oncall_eng_ok
    principal: bob_eng
    question: How quickly must Sev-1 outages be bridged?
    expect:
      answered: true
      must_cite_docs: [POL-ENG-002]
      citations_required: true
