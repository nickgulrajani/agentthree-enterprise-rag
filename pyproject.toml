[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentthree-enterprise-rag"
version = "0.1.0"
description = "Portfolio demo: Enterprise RAG with hybrid retrieval, ACL filtering, grounded citations (local, zero API cost)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgentThree" }]
dependencies = [
  "numpy>=1.26.0",
  "PyYAML>=6.0.1",
  "click>=8.1.7",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
agentthree-rag = "agentthree_enterprise_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
